name: Store-Material

# Lädt die Screenshots aus fastlane/screenshots nach App Store Connect.
# Nur von Hand auslösbar. Ändert keine Texte und reicht nichts ein.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    name: Screenshots hochladen
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Ruby und Fastlane
        uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Hochladen
        run: bundle exec fastlane screenshots
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
