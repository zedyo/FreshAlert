name: CI

# Quality gate: builds the app and runs the unit test suite.
# Runs on every pull request and on every push to main.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    # SwiftLint ist auf den GitHub-macOS-Images vorinstalliert — kein
    # `brew install` nötig. Läuft als eigener Job parallel zu Build & Test.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint
        run: swiftlint lint --reporter github-actions-logging

  test:
    name: Build & Test
    runs-on: macos-15
    # Puffer für Runner-Schwankungen; Build+Tests laufen typisch ~10-20 min.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run tests
        run: bundle exec fastlane test
