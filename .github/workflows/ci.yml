name: CI

# Quality gate: builds the app and runs the unit test suite.
# Runs on every pull request and on every push to main.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftLint
        # Nicht auf dem macos-15-Image vorinstalliert (verifiziert via
        # Lauf 27433532721: "swiftlint: command not found").
        run: brew install swiftlint
      - name: SwiftLint
        run: swiftlint lint --reporter github-actions-logging

  test:
    name: Build & Test
    runs-on: macos-15
    # Puffer für Runner-Schwankungen; Build+Tests laufen typisch ~10-20 min.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run tests
        run: bundle exec fastlane test
        env:
          # Default 3 s ist auf geteilten macOS-Runnern zu aggressiv —
          # `xcodebuild -showBuildSettings` braucht beim Kaltstart gern
          # länger (Flake in CI-Lauf 27436390758).
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "4"
