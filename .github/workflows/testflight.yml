name: TestFlight

# main heißt TestFlight: jeder Merge baut, zählt die Build-Nummer hoch und lädt
# zu TestFlight hoch. KEINE Einreichung zum App Store, das macht store.yml per Tag.
#
# Ohne Signier-Secrets (ASC_*, MATCH_*) wird der Upload übersprungen und im
# Lauf vermerkt. Dann bleibt der iMac die Build-Maschine: `fastlane beta` lokal.

on:
  push:
    branches: [main]

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Build & TestFlight
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Build-Nummer = Commit-Anzahl

      - name: Secrets prüfen
        id: check
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$MATCH_GIT_URL" ]; then
            echo "::notice::Keine Signier-Secrets hinterlegt, TestFlight-Upload übersprungen. Lokal: bundle exec fastlane beta"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Xcode auswählen
        if: steps.check.outputs.ready == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "^26.0"

      - name: Ruby und Fastlane
        if: steps.check.outputs.ready == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build und Upload zu TestFlight
        if: steps.check.outputs.ready == 'true'
        run: bundle exec fastlane beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
