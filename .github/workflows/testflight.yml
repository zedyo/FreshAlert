name: TestFlight

# main heißt TestFlight: jeder Merge baut, zählt die Build-Nummer hoch und lädt
# zu TestFlight hoch. KEINE Einreichung zum App Store, das macht store.yml per Tag.
#
# Ohne Signier-Secrets (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_CONTENT) wird der Upload übersprungen und im
# Lauf vermerkt. Dann bleibt der iMac die Build-Maschine: `fastlane beta` lokal.

on:
  push:
    branches: [main]

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    name: Build & TestFlight
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Build-Nummer = Commit-Anzahl

      - name: Secrets prüfen
        id: check
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -z "$ASC_KEY_ID" ]; then
            echo "::notice::Keine Signier-Secrets hinterlegt, TestFlight-Upload übersprungen. Lokal: bundle exec fastlane beta"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Xcode auswählen
        if: steps.check.outputs.ready == 'true'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "^26.0"

      - name: Ruby und Fastlane
        if: steps.check.outputs.ready == 'true'
        uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build und Upload zu TestFlight
        if: steps.check.outputs.ready == 'true'
        run: bundle exec fastlane beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
