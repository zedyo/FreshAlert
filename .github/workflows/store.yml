name: App Store

# Einreichung zur App-Store-Prüfung, ausgelöst durch ein Tag `vX.Y.Z`.
# Die Version im Bundle wird aus dem Tag gesetzt. Veröffentlicht wird NICHT
# automatisch, das bleibt ein bewusster Klick in App Store Connect.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  submit:
    name: Build & App Store Review
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Secrets prüfen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -z "$ASC_KEY_ID" ]; then
            echo "::error::Keine Signier-Secrets hinterlegt, Einreichung nicht möglich"; exit 1
          fi

      - name: Xcode auswählen
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "^26.0"

      - name: Ruby und Fastlane
        uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build, TestFlight, Einreichung
        run: bundle exec fastlane release version:"${GITHUB_REF_NAME#v}"
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
