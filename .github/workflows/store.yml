name: App Store

# Einreichung zur App-Store-Prüfung, ausgelöst durch ein Tag `vX.Y.Z`.
# Die Version im Bundle wird aus dem Tag gesetzt. Veröffentlicht wird NICHT
# automatisch, das bleibt ein bewusster Klick in App Store Connect.

on:
  push:
    tags: ["v*"]

jobs:
  submit:
    name: Build & App Store Review
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secrets prüfen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$MATCH_GIT_URL" ]; then
            echo "::error::Keine Signier-Secrets hinterlegt, Einreichung nicht möglich"; exit 1
          fi

      - name: Xcode auswählen
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "^26.0"

      - name: Ruby und Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build, TestFlight, Einreichung
        run: bundle exec fastlane release version:"${GITHUB_REF_NAME#v}"
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
